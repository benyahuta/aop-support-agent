app = "larkspur-support-agent"
primary_region = "iad"

[env]
  AGENT_MODEL = "claude-opus-5-5"
  AGENT_EFFORT = "low"
  GUARDRAILS = "enforced"
  DAILY_BUDGET_USD = "10"
  RATE_PER_IP_HOUR = "40"
  RATE_GLOBAL_DAY = "600"

[mounts]
  source = "lp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
